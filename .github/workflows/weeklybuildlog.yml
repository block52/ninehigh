name: Weekly build log

on:
  schedule:
    # 23:00 UTC Sunday = 09:00 Monday, Australia/Brisbane (UTC+10, no DST).
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Write an article even if the week was quiet"
        type: boolean
        default: false
      week:
        description: "Back-fill a week — any date in it (YYYY-MM-DD). Blank = the previous complete week."
        type: string
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: weekly-build-log
  cancel-in-progress: false

jobs:
  build-log:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          # Push with the PAT rather than GITHUB_TOKEN so the Pages build
          # still fires on the resulting commit.
          token: ${{ secrets.BLOCK52_TOKEN }}
          fetch-depth: 0

      - name: Collect the week's activity
        id: collect
        env:
          GH_TOKEN: ${{ secrets.BLOCK52_TOKEN }}
          PR_THRESHOLD: "5"
          # Empty on the schedule, so the script takes the previous complete week.
          WEEK_START: ${{ inputs.week }}
        run: |
          chmod +x .github/scripts/collect-week.sh
          .github/scripts/collect-week.sh

      - name: Write the article
        if: steps.collect.outputs.should_write == 'true' || inputs.force
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(jq:*),Bash(wc:*),Bash(date:*)"
          prompt: |
            You are writing this week's build-log article for the 9 High Studios
            site. You are already in a checkout of the block52/ninehigh repo.

            `week-data.json` in the repo root holds everything that happened
            across the three Block 52 repos between
            ${{ steps.collect.outputs.window_start }} and
            ${{ steps.collect.outputs.window_end }}: per-repo merged pull
            requests with line counts, commit messages, and any releases cut.
            Read it first. Every number you print must come from that file —
            never estimate, never round up to something you did not count.

            Read `articles/three-weeks-go-engine.md` and
            `article-three-weeks-go-engine.html` next. They are the house
            template and the tone to match: first-person plural, concrete,
            engineering-led, unhype. The article opens with a scoreboard of the
            numbers, then explains what those numbers were actually spent on.

            Produce four changes:

            1. `articles/<slug>.md` — the markdown source. YAML frontmatter with
               title, `author: Nine High Studios`,
               `date: ${{ steps.collect.outputs.article_date }}`, and tags
               starting with `Build Log` plus two to four that fit the week's
               real work. Then: an H1, an italic one-line standfirst, a lead
               paragraph naming the range (${{ steps.collect.outputs.window_label }})
               and the headline numbers, a `## The scoreboard` table of
               Repository / Merged PRs / Lines added / Lines removed / Total
               changed with a bold Total row, then sections on the substantive
               work. 700-1200 words. Lead with whatever was genuinely the
               biggest thing that week rather than marching through the repos in
               order. If a week is mostly small fixes, say so plainly and keep
               it short rather than inflating it.

            2. `article-<slug>.html` — copy `article-three-weeks-go-engine.html`
               and replace only the content: <title>, meta description,
               og:title, og:description, the canonical href, the <h1>,
               `.article-meta-info` (By Nine High Studios &middot; <Month Year>
               &middot; <N> min read, at ~220 words/min), the `.article-tags`
               spans, and everything inside `.article-body`. Leave the entire
               <style> block, <nav> and footer byte-for-byte unchanged. Reuse
               `.stat-grid`/`.stat-card` for headline numbers and `.repo-pill`
               for UI / PVM / Chain. Escape entities as the existing articles do
               (&mdash;, &middot;, &amp;).

            3. `blog.html` — add a new `<a href="article-<slug>.html"
               class="article-card">` block as the FIRST card in the list,
               matching the existing card structure exactly.

            4. `sitemap.xml` — add a <url> entry for the new page following the
               file's own host convention, with <lastmod> set to the article
               date, <changefreq>monthly</changefreq>, <priority>0.7</priority>.

            Slug: short, descriptive, kebab-case, matching the naming style of
            the files already there.

            Do not commit — a later step does that. Do not modify week-data.json
            or anything under .github/.

      - name: Commit and push
        id: publish
        if: steps.collect.outputs.should_write == 'true' || inputs.force
        run: |
          rm -f week-data.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "::warning::Claude produced no changes — nothing to publish."
            exit 0
          fi
          git config user.name  "9 High Build Log"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          ARTICLE_HTML=$(git diff --cached --name-only \
                  | grep -m1 '^article-.*\.html$' || true)
          TITLE=$(git diff --cached --name-only | grep -m1 '^articles/.*\.md$' \
                  | xargs -r -I{} sh -c "sed -n 's/^title: *//p' {} | head -1 | tr -d '\"'")
          git commit -m "blog: add \"${TITLE:-weekly}\" build log

          Week of ${{ steps.collect.outputs.window_label }} —
          ${{ steps.collect.outputs.pr_total }} merged PRs across UI, PVM and Chain.

          Co-Authored-By: Claude Opus 4.8 <noreply@anthropic.com>"
          git push
          SHA=$(git rev-parse --short HEAD)
          echo "Published: $SHA" >> "$GITHUB_STEP_SUMMARY"
          # Expose the published page so the tweet steps can run. Empty when
          # nothing was published, which gates those steps off.
          if [ -n "$ARTICLE_HTML" ]; then
            echo "article_html=$ARTICLE_HTML" >> "$GITHUB_OUTPUT"
            echo "article_url=https://ninehighstudios.com/$ARTICLE_HTML" >> "$GITHUB_OUTPUT"
            echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          fi

      - name: Draft the social posts
        id: social_draft
        if: steps.publish.outputs.article_url != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 10
            --allowedTools "Read,Write"
          prompt: |
            Write social posts announcing this week's build-log article and
            save them to two files in the repo root: `tweet.txt` and
            `facebook.txt`. Those two files are the only things you should
            create; do not touch anything else.

            The article lives at `${{ steps.publish.outputs.article_html }}`
            in this checkout, titled "${{ steps.publish.outputs.title }}". Its
            public URL is ${{ steps.publish.outputs.article_url }}. Read the
            article first so both posts reflect what actually shipped.

            Voice for both: 9 High Studios — first-person plural, concrete,
            engineering-led, no hype, no emoji-spam (one tasteful emoji at
            most, usually none). Lead with the single most interesting thing
            that shipped or a headline number from the scoreboard, not a
            generic "new post." Do not make the two posts word-for-word
            identical — the Facebook one can breathe a little.

            tweet.txt — the X post:
            - Entire tweet INCLUDING the URL at most 270 characters (X counts a
              URL as 23 chars — leave margin).
            - End with the URL on its own line, exactly:
              ${{ steps.publish.outputs.article_url }}
            - At most one hashtag, only if it genuinely fits.

            facebook.txt — the Facebook Page post:
            - No hard length limit, but keep it tight: 2-4 sentences. Facebook
              renders its own link preview card from the URL, so you do NOT need
              to describe the link mechanically — write the commentary that
              makes someone click.
            - End with the URL on its own line, exactly:
              ${{ steps.publish.outputs.article_url }}

            Both files: plain text only. No surrounding quotes, no markdown, no
            preamble. Write ONLY the post text to each file.

      - name: Post to X
        if: steps.publish.outputs.article_url != ''
        env:
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          if [ ! -s tweet.txt ]; then
            echo "::warning::No tweet.txt produced — skipping the post."
            exit 0
          fi
          TEXT=$(cat tweet.txt)
          echo "Tweeting: $TEXT"
          .github/scripts/post-tweet.sh "$TEXT"
          rm -f tweet.txt

      - name: Post to Facebook
        if: steps.publish.outputs.article_url != ''
        env:
          FB_PAGE_ID:           ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -s facebook.txt ]; then
            echo "::warning::No facebook.txt produced — skipping the post."
            exit 0
          fi
          TEXT=$(cat facebook.txt)
          echo "Posting to Facebook: $TEXT"
          .github/scripts/post-facebook.sh "$TEXT" "${{ steps.publish.outputs.article_url }}"
          rm -f facebook.txt

      - name: Quiet week
        if: steps.collect.outputs.should_write != 'true' && !inputs.force
        run: |
          echo "Only ${{ steps.collect.outputs.pr_total }} merged PRs this week — skipping the article."
